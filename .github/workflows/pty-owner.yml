name: PTY owner
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner:
    name: Native owner (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      AYA_OWNER_ELECTRON_DIST: ${{ github.workspace }}/test-results/owner-electron
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      AYA_OWNER_EXPECT_PIDFD: ${{ matrix.platform == 'linux' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (preparation)
        run: npm ci
      - name: Verify native target
        run: node -e 'if (process.platform !== "${{ matrix.platform }}" || process.arch !== "${{ matrix.arch }}") throw new Error("Wrong native runner architecture")'
      - name: Prepare the Electron distribution (network allowed only in preparation)
        run: node scripts/prepare-owner-electron.cjs
      - name: Build without downloading native headers
        run: npm run build
      - name: Native owner contracts
        run: node --test tests/pty-owner.test.mjs tests/pty-owner-package-receipt.test.mjs tests/pty-owner-adapter.test.mjs tests/pty-owner-boundary.test.mjs tests/pty-owner-idle-frame.test.mjs tests/pty-owner-client-framing.test.mjs tests/pty-host-uncertain-owner.test.mjs tests/pty-owner-dead-inventory.test.mjs tests/pty-host-first-spawn-loss.test.mjs tests/pty-owner-large-input.test.mjs tests/pty-owner-spawn-intent.test.mjs tests/pty-planned-natural-exit.test.mjs tests/pty-planned-replay-ack.test.mjs tests/pty-cross-runtime-handover.test.mjs tests/pty-ended-checkpoint.test.mjs tests/pty-crash-recovery.test.mjs tests/pty-host-restart-consent.test.mjs tests/pty-crash-core.test.mjs tests/vt-recovery-screen.test.mjs tests/pty-exit-delivery.test.mjs tests/pty-exit-reconnect.test.mjs tests/pty-host-crash-recovery.test.mjs tests/pty-host-auth-signal.test.mjs tests/pty-host-auth-restart.test.mjs tests/pty-host-auth-restart-real.test.mjs tests/pty-host-auth.test.mjs tests/pty-host-auth-transfer.test.mjs tests/pty-host-auth-key.test.mjs tests/pty-host-auth-transport.test.mjs tests/pty-host-principal-wait.test.mjs tests/pty-host-auth-bootstrap.test.mjs tests/pty-host-auth-integration.test.mjs tests/pty-host-auth-status.test.mjs tests/pty-host-start-guard.test.mjs tests/pty-host-owner-continuity.test.mjs tests/pty-host-owner-continuity-real.test.mjs tests/pty-host-owner-retirement.test.mjs tests/pty-host-owner-retirement-real.test.mjs tests/pty-host-legacy-status.test.mjs
      - name: Bundled screen rules and read-only state contracts in Electron
        run: ELECTRON_RUN_AS_NODE=1 ./node_modules/.bin/electron --test tests/screen-rule-data.test.mjs tests/screen-rule-provider.test.mjs tests/screen-rule-equivalence.test.mjs tests/pane-state.test.mjs tests/aya-cli-pane-state.test.mjs tests/pane-state-read-only.test.mjs
      - name: Two-build identity, 1/25 panes, idle usage and FD cleanup
        run: node scripts/measure-pty-owner.mjs
      - name: Staged package smoke (ad-hoc signing only, no notarization)
        run: npm run test:owner-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/owner-measurements-*.json
            test-results/owner-package-*/owner-entitlements.plist
            test-results/owner-package-*/owner-package-identity.json
